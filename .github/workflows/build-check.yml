name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated output matches source
        run: npm run check

      - name: Test content authoring and generation
        run: npm run test:build

      - name: Install browser for rendered-site checks
        run: npx playwright install --with-deps chromium

      - name: Verify rendered site
        run: npm run test:browser

      - name: Check patch formatting
        run: git diff --check
