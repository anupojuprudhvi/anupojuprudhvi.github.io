name: Build check

# Every push and PR is verified. A push to main deploys to GitHub Pages only
# after every check in the build job passes (repo Settings → Pages → Source
# must be "GitHub Actions").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated output matches source
        run: npm run check

      - name: Test content authoring and generation
        run: npm run test:build

      - name: Test local preview server
        run: npm run test:preview

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install browser for rendered-site checks
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Verify rendered site
        run: npm run test:browser
        env:
          VERIFY_CONCURRENCY: 4

      - name: Check patch formatting
        run: git diff --check

      - name: Stage the public site
        run: npm run stage

      - name: Lighthouse budgets (performance, accessibility, best practices, SEO)
        run: npm run lighthouse

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore

      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # The local Docker setup (hardened nginx + full suite + header checks), so it
  # can't silently rot. Independent of the deploy, which is plain static files.
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test the containers
        run: docker compose up --build --exit-code-from tests

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
