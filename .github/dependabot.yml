version: 2
updates:
  # Keeps the workflow's actions/* pins on supported major versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the local Docker setup. Tags set through ARG (node,
  # playwright) are not visible to Dependabot; bump those by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # Dev-only test tooling (Playwright, axe); the site itself has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      test-tooling:
        patterns: ["*"]
