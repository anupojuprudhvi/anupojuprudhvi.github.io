# Serves the generated static site the way GitHub Pages does (directory
# index.html, branded /404.html), plus the response headers GitHub Pages
# can't send. Loaded into the http {} block of the nginx image.

# Short cache for HTML so new builds show up immediately; longer for assets.
map $sent_http_content_type $site_cache_control {
  default                  "no-cache";
  ~^text/css               "public, max-age=3600";
  ~^(application|text)/javascript "public, max-age=3600";
  ~^image/                 "public, max-age=604800";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json
             application/xml application/rss+xml image/svg+xml text/plain;

  # Security headers. The CSP matches the <meta> policy in every page, plus
  # frame-ancestors, which only works as a real header.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $site_cache_control always;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # Never serve dotfiles (e.g. a stray .git or .env) even if one is copied in.
  location ~ /\. {
    return 404;
  }
}
